version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: forteux-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-forteux}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-forteux_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-forteux}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forteux -d forteux"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: forteux-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:RELEASE.2024-05-09T17-04-24Z
    container_name: forteux-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set local http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb --ignore-existing local/forteux-private-screenshots;
      /usr/bin/mc anonymous set none local/forteux-private-screenshots;
      echo 'MinIO private bucket forteux-private-screenshots configured successfully';
      exit 0;
      "

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: forteux-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      APP_ENV: development
      LOG_LEVEL: DEBUG
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-forteux}:${POSTGRES_PASSWORD:-forteux_dev_password}@postgres:5432/${POSTGRES_DB:-forteux}
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      S3_BUCKET: forteux-private-screenshots
      S3_ENDPOINT_URL: http://minio:9000
      DEV_AUTH_ENABLED: "true"
      DEV_AUTH_SECRET: ${DEV_AUTH_SECRET:-forteux-local-dev-jwt-signing-secret-key-32bytes}
      ALLOWED_ORIGINS: http://localhost:3000,http://frontend:3000
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: forteux-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: development
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-local-development-nextauth-secret-change-in-production}
      BACKEND_API_URL: http://backend:8000/api/v1
      DEV_AUTH_ENABLED: "true"
      NEXT_PUBLIC_DEV_AUTH_ENABLED: "true"
      NEXT_PUBLIC_OIDC_ENABLED: "false"
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: forteux_postgres_data
  minio_data:
    name: forteux_minio_data
