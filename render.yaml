services:
  - type: web
    name: forteux-api
    runtime: docker
    rootDir: backend
    dockerfilePath: Dockerfile
    plan: free
    healthCheckPath: /health/ready
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: API_PREFIX
        value: /api/v1
      - key: DEV_AUTH_ENABLED
        value: "false"
      - key: AWS_REGION
        value: eu-west-1
      - key: S3_BUCKET
        value: forteux-private-assets
      - key: OIDC_ISSUER
        value: https://edlkpfrlsrgslcdwjykv.supabase.co/auth/v1
      - key: OIDC_CLIENT_ID
        value: authenticated
      - key: OIDC_JWKS_URL
        value: https://edlkpfrlsrgslcdwjykv.supabase.co/auth/v1/.well-known/jwks.json
      - key: SUPABASE_URL
        value: https://edlkpfrlsrgslcdwjykv.supabase.co
      - key: S3_ENDPOINT_URL
        value: https://edlkpfrlsrgslcdwjykv.supabase.co/storage/v1/s3
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
